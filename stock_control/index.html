<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Stock Control</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Stock Control</h1>
            <h2>Manage your inventory efficiently</h2>
        </div>
        <div class="dashboard">
            <h3>Total: <span id="total">0</span></h3>
            <h3>Baixo estoque: <span id="baixo-estoque">0</span></h3>
            <h3>Sem estoque: <span id="sem-estoque">0</span></h3>
        </div>
        <div class="pesquisa">
            <input type="text" id="campo-pesquisa" placeholder="Pesquisar Produtos...">
            <button id="btn-pesquisar">Pesquisar</button>
        </div>
        <div id="mensagem" role="status"></div>

        <div class="cadastro">
            <h3>Informações para cadastro do Produto:</h3>
            <div class="form-group">
                 <label for="nome">Nome:</label>
                 <input type="text" id="nome" placeholder="Digite o nome do produto...">
            </div>
            
             <div class="form-group">
                 <label for="valor">Valor:</label>
                 <input type="number" id="valor" placeholder="Digite o valor do produto...">
            </div>
           
             <div class="form-group">
                 <label for="quantidade">Quantidade:</label>
                 <input type="number" id="quantidade" placeholder="Digite a quantidade de produtos...">
             </div>
           
             <div class="form-group">
                 <label for="categoria">Categoria:</label>
                 <select id="categoria"></select>
            </div>
           
            <button id="btn-cadastrar">Cadastrar</button>

        </div>
        <div class="editar-produtos">
             <h3>Informações para edição do Produto:</h3>
            <div class="form-group">
                 <label for="editar-nome">Nome:</label>
                 <input type="text" id="editar-nome" placeholder="Modifique o nome do produto...">
            </div>
            
             <div class="form-group">
                 <label for="editar-valor">Valor:</label>
                 <input type="number" id="editar-valor" placeholder="Modifique o valor do produto...">
            </div>
           
             <div class="form-group">
                 <label for="editar-quantidade">Quantidade:</label>
                 <input type="number" id="editar-quantidade" placeholder="Modifique a quantidade de produtos...">
             </div>
           
            <div class="form-group">
                <label for="editar-categoria">Categoria:</label>
                <select id="editar-categoria"></select>
        </div>
           
            <button id="btn-salvar">Salvar Alterações</button>
            <button id="btn-cancelar">Cancelar</button>
        </div>

        <div class="produtos">

        </div>
    </div>

    





















    <script src="script.js"></script>
</body>
</html>
